name: Lint, Security & Smoke Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run Home Assistant App Linter
        uses: frenck/action-addon-linter@v2.21.2
        with:
          path: "./antigravity"

      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: "./antigravity/Dockerfile"
          config: "./.hadolint.yaml"

      - name: Install yamllint and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint shellcheck

      - name: Run yamllint
        run: yamllint .

      - name: Run shellcheck on rootfs scripts
        run: |
          shellcheck \
            antigravity/rootfs/etc/cont-init.d/10-init-antigravity.sh \
            antigravity/rootfs/etc/services.d/ttyd/run \
            antigravity/rootfs/etc/services.d/ttyd/finish \
            antigravity/rootfs/etc/services.d/agy-remote/run \
            antigravity/rootfs/etc/services.d/agy-remote/finish \
            antigravity/rootfs/etc/services.d/agy-api/run \
            antigravity/rootfs/etc/services.d/agy-api/finish \
            antigravity/rootfs/usr/local/bin/agy-apply-mode \
            antigravity/rootfs/usr/local/bin/agy-terminal \
            antigravity/rootfs/usr/local/bin/agy-welcome

      - name: Run Python lint, syntax check & REST API unit test suite
        run: |
          pipx run ruff check \
            antigravity/rootfs/usr/local/bin/agy-api-server.py \
            scripts/sync_models.py \
            tests/test_agy_api.py \
            tests/test_docs_sync.py
          python3 -m py_compile \
            antigravity/rootfs/usr/local/bin/agy-api-server.py \
            scripts/sync_models.py \
            tests/test_agy_api.py \
            tests/test_docs_sync.py
          python3 -m unittest discover -s tests -v

      - name: Run actionlint on GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Run gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU for aarch64 smoke check
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Build App container image (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --tag antigravity:smoke-test \
            --load \
            ./antigravity

      - name: Run Trivy config security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "latest"
          scan-type: "config"
          scan-ref: "./antigravity"
          format: "sarif"
          output: "trivy-config-results.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy config scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-config-results.sarif"
          category: "trivy-config"

      - name: Run Trivy container image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "latest"
          scan-type: "image"
          image-ref: "antigravity:smoke-test"
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"

      - name: Boot container and run end-to-end health checks
        run: |
          cache_dir="$(mktemp -d)"
          chmod 700 "${cache_dir}"
          ssh_tmp="$(mktemp -d)"
          ssh-keygen -t ed25519 -N "" -f "${ssh_tmp}/id_test" >/dev/null 2>&1
          test_ssh_b64="$(base64 < "${ssh_tmp}/id_test" | tr -d '\n')"
          expected_ssh_pub="$(cat "${ssh_tmp}/id_test.pub")"

          jq -n \
            --arg ssh_b64 "${test_ssh_b64}" \
            '{
              "instance_name": "ci-smoke-test",
              "permission_mode": "turbo",
              "remote_control": true,
              "auto_update_cli": false,
              "workspace_dir": "/homeassistant",
              "api_enabled": true,
              "api_port": 8120,
              "default_model": "gemini-4-hydrogen-low",
              "default_timeout": 180,
              "ha_mcp_enabled": true,
              "ha_mcp_url": "http://homeassistant:8123/api/mcp",
              "ha_mcp_token": "ci-test-token",
              "ssh_private_key": $ssh_b64,
              "gemini_api_key": "ci-test-gemini-key",
              "log_level": "info"
            }' > "${cache_dir}/addons.self.options.config.cache"
          chmod 600 "${cache_dir}/addons.self.options.config.cache"

          docker run -d \
            --name antigravity-smoke \
            -p 127.0.0.1:8099:8099 \
            -p 127.0.0.1:8120:8120 \
            -e CACHE_DIR=/tmp/.bashio \
            -v "${cache_dir}:/tmp/.bashio" \
            antigravity:smoke-test

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8099/ >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8120/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker logs antigravity-smoke

          # 1. Verify ttyd Ingress endpoint is serving HTTP 200
          curl -fsS http://127.0.0.1:8099/ >/dev/null

          # 1b. Verify agy-api REST endpoint reflects default_timeout=180, auth=true, and version
          curl -fsS http://127.0.0.1:8120/health | jq -e '
            .status == "ok"
            and .service == "agy-api"
            and .default_timeout == 180
            and .authenticated == true
            and (.agy_version | length > 0)
          '

          # 2. Verify agy CLI binary is installed in persistent /data/bin/agy
          docker exec antigravity-smoke /usr/local/bin/agy --version

          # 2b. Verify gemini_api_key injection in s6 container_environment
          test "$(docker exec antigravity-smoke \
            cat /run/s6/container_environment/GEMINI_API_KEY)" = "ci-test-gemini-key"

          # 3. Verify all 4 permission modes (turbo, auto, request_review, default)
          docker exec antigravity-smoke jq -e \
            '.userSettings.permissionPreset == "AGENT_PERMISSION_PRESET_TURBO"' \
            /data/.gemini/config/config.json
          docker exec antigravity-smoke jq -e \
            '.permissionPreset == "Turbo" and .agentMode == "auto"' \
            /data/.gemini/antigravity-cli/settings.json

          docker exec antigravity-smoke /usr/local/bin/agy-apply-mode auto /homeassistant
          docker exec antigravity-smoke jq -e \
            '.userSettings.permissionPreset == "AGENT_PERMISSION_PRESET_AUTO"
             and .userSettings.enableTerminalSandbox == true' \
            /data/.gemini/config/config.json
          docker exec antigravity-smoke jq -e \
            '.permissionPreset == "Auto" and .agentMode == "auto"' \
            /data/.gemini/antigravity-cli/settings.json

          docker exec antigravity-smoke /usr/local/bin/agy-apply-mode request_review /homeassistant
          docker exec antigravity-smoke jq -e \
            '.userSettings.permissionPreset == "AGENT_PERMISSION_PRESET_REQUEST_REVIEW"' \
            /data/.gemini/config/config.json
          docker exec antigravity-smoke jq -e \
            '.permissionPreset == "Request Review" and .agentMode == "default"' \
            /data/.gemini/antigravity-cli/settings.json

          docker exec antigravity-smoke /usr/local/bin/agy-apply-mode default /homeassistant
          docker exec antigravity-smoke jq -e \
            '.userSettings.permissionPreset == "AGENT_PERMISSION_PRESET_DEFAULT"' \
            /data/.gemini/config/config.json
          docker exec antigravity-smoke jq -e \
            '.permissionPreset == "Default" and .agentMode == "default"' \
            /data/.gemini/antigravity-cli/settings.json

          # Restore turbo mode
          docker exec antigravity-smoke /usr/local/bin/agy-apply-mode turbo /homeassistant

          # 4. Verify Home Assistant MCP configuration
          docker exec antigravity-smoke jq -e \
            '.mcpServers["home-assistant"].url == "http://homeassistant:8123/api/mcp"' \
            /data/.gemini/config/mcp_config.json

          # 5. Verify SSH keypair, ssh_config, and /root/.local + /root/workspace symlinks
          docker exec antigravity-smoke test -f /data/.ssh/id_ed25519
          docker exec antigravity-smoke test -f /data/.ssh/id_ed25519.pub
          test "$(docker exec antigravity-smoke readlink /root/.local)" = "/data/.local"
          test "$(docker exec antigravity-smoke readlink /root/workspace)" = "/data/workspace"
          actual_ssh_pub="$(docker exec antigravity-smoke cat /data/.ssh/id_ed25519.pub)"
          test "${actual_ssh_pub}" = "${expected_ssh_pub}"
          docker exec antigravity-smoke grep -q \
            "StrictHostKeyChecking accept-new" /data/.ssh/config

          # 6. Verify App and CLI versions are logged on startup
          docker logs antigravity-smoke | grep -E "Starting Home Assistant App: Antigravity CLI v"
          docker logs antigravity-smoke | grep -E "Active Antigravity CLI \(agy\) version:"

          # 7. Verify live POST /api/generate E2E (sync structured + async 202) with stubbed agy
          docker exec antigravity-smoke sh -c '
            mv -f /data/bin/agy /data/bin/agy.real &&
            {
              echo "#!/usr/bin/env python3"
              echo "import json, sys"
              echo "out = {"
              echo "  \"response\": \"E2E_OK:\" + \" \".join(sys.argv[1:]),"
              echo "  \"structured_output\": {\"ok\": True},"
              echo "  \"conversation_id\": \"e2e-conv-1\","
              echo "  \"usage\": {\"tokens\": 10}"
              echo "}"
              echo "print(json.dumps(out))"
            } > /data/bin/agy &&
            chmod +x /data/bin/agy
          '
          curl -fsS -X POST http://127.0.0.1:8120/api/generate \
            -H "Content-Type: application/json" \
            -d '{
              "prompt":"test-prompt",
              "files":["/media/snap.jpg"],
              "model":"gemini-4-hydrogen-low",
              "json_schema":{"type":"object","properties":{"ok":{"type":"boolean"}}}
            }' \
            | jq -e '
              .status == "success"
              and (.response | contains("E2E_OK:"))
              and (.response | contains("/media/snap.jpg"))
              and .structured.ok == true
              and .conversation_id == "e2e-conv-1"
              and .usage.tokens == 10
            '
          curl -fsS -X POST http://127.0.0.1:8120/api/generate \
            -H "Content-Type: application/json" \
            -d '{"prompt":"async-test","async":true,"event_type":"agy_e2e_done","request_id":"e2e-1"}' \
            | jq -e '.status == "accepted" and .async == true and .event_type == "agy_e2e_done"'
          sleep 1
          docker exec antigravity-smoke mv -f /data/bin/agy.real /data/bin/agy

          # 8. Verify persistence + baked-in upgrade (even when auto_update_cli=false) across restart
          docker exec antigravity-smoke sh -c '
            jq ".customTestKey = \"preserved\"" /data/.gemini/config/config.json > /tmp/cfg.json &&
            mv /tmp/cfg.json /data/.gemini/config/config.json &&
            jq ".mcpServers[\"custom-mcp\"] = {\"url\":\"http://localhost:9999\"}" \
              /data/.gemini/config/mcp_config.json > /tmp/mcp.json &&
            mv /tmp/mcp.json /data/.gemini/config/mcp_config.json &&
            printf "#!/bin/sh\necho 0.0.1\n" > /tmp/old-agy &&
            chmod +x /tmp/old-agy &&
            mv -f /tmp/old-agy /data/bin/agy
          '
          jq 'del(.ssh_private_key)' "${cache_dir}/addons.self.options.config.cache" \
            > "${cache_dir}/tmp.cache"
          mv "${cache_dir}/tmp.cache" "${cache_dir}/addons.self.options.config.cache"
          chmod 600 "${cache_dir}/addons.self.options.config.cache"
          docker restart antigravity-smoke
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8120/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          new_pub="$(docker exec antigravity-smoke cat /data/.ssh/id_ed25519.pub)"
          test "${actual_ssh_pub}" = "${new_pub}"
          docker exec antigravity-smoke jq -e \
            '.customTestKey == "preserved"' /data/.gemini/config/config.json
          docker exec antigravity-smoke jq -e \
            '.mcpServers["custom-mcp"].url == "http://localhost:9999"' \
            /data/.gemini/config/mcp_config.json
          docker exec antigravity-smoke jq -e \
            '.mcpServers["home-assistant"].url == "http://homeassistant:8123/api/mcp"' \
            /data/.gemini/config/mcp_config.json
          test "$(docker exec antigravity-smoke /data/bin/agy --version)" != "0.0.1"

          # 9. Verify api_enabled=false, remote_control=false, ha_mcp_enabled=false toggles
          jq '.api_enabled = false | .remote_control = false | .ha_mcp_enabled = false' \
            "${cache_dir}/addons.self.options.config.cache" > "${cache_dir}/tmp.cache"
          mv "${cache_dir}/tmp.cache" "${cache_dir}/addons.self.options.config.cache"
          chmod 600 "${cache_dir}/addons.self.options.config.cache"
          docker restart antigravity-smoke
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8099/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          sleep 2
          if curl -fsS http://127.0.0.1:8120/health >/dev/null 2>&1; then
            echo "ERROR: agy-api should be disabled when api_enabled=false"
            exit 1
          fi
          docker logs antigravity-smoke | grep -q \
            "Antigravity REST API daemon is disabled via app configuration"
          docker logs antigravity-smoke | grep -q \
            "Remote Control daemon is disabled via app configuration"
          docker exec antigravity-smoke jq -e '
            (.mcpServers | has("home-assistant") | not)
            and (.mcpServers["custom-mcp"].url == "http://localhost:9999")
          ' /data/.gemini/config/mcp_config.json

          docker rm -f antigravity-smoke
          rm -rf "${ssh_tmp}"
          sudo rm -rf "${cache_dir}"

      - name: Build & verify aarch64 container binaries under QEMU
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg TARGETARCH=arm64 \
            --tag antigravity:smoke-arm64 \
            --load \
            ./antigravity

          docker run --rm --platform linux/arm64 --entrypoint /bin/bash antigravity:smoke-arm64 -c '
            set -euo pipefail
            test "$(uname -m)" = "aarch64"
            /opt/antigravity/bin/agy --version
            /usr/bin/ttyd --version
            /usr/bin/ha --version
            python3 --version
          '
