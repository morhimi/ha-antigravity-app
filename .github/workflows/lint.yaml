name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant App Linter
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./antigravity"

      - name: Install yamllint and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint shellcheck

      - name: Run yamllint
        run: yamllint .

      - name: Run shellcheck on rootfs scripts
        run: |
          shellcheck \
            antigravity/rootfs/etc/cont-init.d/10-init-antigravity.sh \
            antigravity/rootfs/etc/services.d/ttyd/run \
            antigravity/rootfs/etc/services.d/ttyd/finish \
            antigravity/rootfs/etc/services.d/agy-remote/run \
            antigravity/rootfs/etc/services.d/agy-remote/finish \
            antigravity/rootfs/usr/local/bin/agy-terminal \
            antigravity/rootfs/usr/local/bin/agy-welcome
