# https://contributors.home-assistant.io/apps/reference/configuration/
name: Antigravity CLI
version: "1.4.0"
slug: antigravity
description: >-
  Google Antigravity autonomous AI agent CLI (agy) with persistent Remote
  Control daemon, local REST API, and Ingress web terminal
url: "https://github.com/morhimi/ha-antigravity-app/tree/main/antigravity"
arch:
  - aarch64
  - amd64
hassio_api: true
hassio_role: manager
homeassistant_api: true
ingress: true
init: false
panel_icon: mdi:robot-outline
panel_title: Antigravity
startup: services
ports:
  8120/tcp: 8120
ports_description:
  8120/tcp: "Local REST API for Home Assistant Automations"
map:
  - all_app_configs:rw
  - local_apps:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:ro
options:
  instance_name: "home-assistant"
  permission_mode: "turbo"
  remote_control: true
  auto_update_cli: true
  workspace_dir: "/homeassistant"
  api_enabled: true
  api_port: 8120
  default_model: "gemini-3.8-flash-low"
  ha_mcp_enabled: true
  ha_mcp_url: "http://homeassistant:8123/api/mcp"
  log_level: "info"
schema:
  instance_name: str
  permission_mode: list(turbo|auto|default|request_review)
  remote_control: bool
  auto_update_cli: bool
  workspace_dir: str
  api_enabled: bool
  api_port: port
  default_model: list(gemini-3.8-flash-low|gemini-3.8-flash-medium|gemini-3.8-flash-high|gemini-4-argon-low|gemini-4-argon-medium|gemini-4-argon-high)
  ha_mcp_enabled: bool
  ha_mcp_url: str
  ha_mcp_token: password?
  ssh_private_key: password?
  gemini_api_key: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
image: "ghcr.io/morhimi/app-antigravity"
